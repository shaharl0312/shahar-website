<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שחר לוי - ליווי פיננסי לאנשי קבע</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #09090b;
      --gold:    #C9A84C;
      --gold-l:  #d8bc6e;
      --gold-g:  rgba(201,168,76,.12);
      --gold-b:  rgba(201,168,76,.25);
      --text-1:  #f2f3f5;
      --text-2:  #9ca3af;
      --text-3:  #5c636e;
      --border:  rgba(255,255,255,.065);
      --ease:    240ms ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans Hebrew', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-2);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* background effects */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(201,168,76,.13) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 10% 90%,  rgba(27,58,107,.14)  0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 90% 90%,  rgba(27,58,107,.10)  0%, transparent 55%);
    }
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(201,168,76,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,.022) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    /* animations */
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseG  { 0%,100% { box-shadow: 0 0 0 0 rgba(201,168,76,.5); } 50% { box-shadow: 0 0 0 8px rgba(201,168,76,0); } }
    @keyframes spin360 { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* layout */
    .card {
      position: relative; z-index: 1;
      max-width: 520px; width: 100%;
      text-align: center;
    }

    /* badge */
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--gold-g); border: 1px solid var(--gold-b);
      color: var(--gold); font-size: 13px; font-weight: 600;
      padding: 7px 18px; border-radius: 40px;
      margin-bottom: 28px;
      animation: fadeUp .6s ease both;
    }
    .badge-dot {
      width: 7px; height: 7px;
      background: var(--gold); border-radius: 50%;
      animation: pulseG 2s ease infinite;
    }

    /* headlines */
    h1 {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 800; line-height: 1.15;
      letter-spacing: -.02em;
      color: var(--text-1);
      margin-bottom: 18px;
      animation: fadeUp .6s .1s ease both;
    }
    h1 span { color: var(--gold); }

    h2 {
      font-size: clamp(17px, 3.5vw, 22px);
      font-weight: 600; line-height: 1.4;
      color: var(--text-2);
      margin-bottom: 14px;
      animation: fadeUp .6s .2s ease both;
    }

    .sub {
      font-size: clamp(15px, 2.5vw, 17px);
      color: var(--text-3);
      line-height: 1.6;
      margin-bottom: 40px;
      animation: fadeUp .6s .3s ease both;
    }

    /* divider */
    .divider {
      width: 40px; height: 2px;
      background: linear-gradient(90deg, var(--gold), transparent);
      border-radius: 2px;
      margin: 0 auto 40px;
      animation: fadeUp .6s .25s ease both;
    }

    /* form */
    .form {
      display: flex; flex-direction: column; gap: 12px;
      animation: fadeUp .6s .35s ease both;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      color: var(--text-1);
      text-align: right;
      font-family: 'Noto Sans Hebrew', sans-serif;
      transition: border-color var(--ease), background var(--ease);
    }
    input::placeholder { color: var(--text-3); }
    input:focus { outline: none; border-color: var(--gold-b); background: rgba(255,255,255,.07); }

    .btn-submit {
      display: block; width: 100%;
      background: var(--gold); color: #08080a;
      font-family: 'Noto Sans Hebrew', sans-serif;
      font-size: 18px; font-weight: 700;
      padding: 18px 24px; border-radius: 12px;
      border: none; cursor: pointer; margin-top: 4px;
      box-shadow: 0 4px 24px rgba(201,168,76,.3);
      transition: background var(--ease), transform var(--ease), box-shadow var(--ease);
    }
    .btn-submit:hover  { background: var(--gold-l); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(201,168,76,.4); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .err, .field-err {
      color: #f87171;
      font-size: 13px;
      display: none;
      text-align: right;
      margin-top: -4px;
    }

    /* trust line */
    .trust {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-3);
      animation: fadeUp .6s .5s ease both;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="card">
    <h1>רוצים לגרום לכסף שלכם<br><span>לעבוד בשבילכם?</span></h1>

    <h2>אנשי קבע? מגיע לכם 500 ש"ח בחזרה בסוף התהליך</h2>

    <div class="divider"></div>

    <p class="sub">מלאו שם ומספר טלפון ואחזור אליכם</p>

    <form class="form" id="leadForm" novalidate>
      <input type="text"  id="name"  placeholder="שם מלא"    autocomplete="name" />
      <p class="field-err" id="nameErr">נא להזין שם מלא</p>
      <input type="tel"   id="phone" placeholder="מספר טלפון" autocomplete="tel"  />
      <p class="field-err" id="phoneErr">נא להזין מספר טלפון תקין</p>
      <p class="err" id="errMsg">משהו השתבש - נסו שוב</p>
      <button type="button" class="btn-submit" id="submitBtn" onclick="submitLead()">אני רוצה לדעת יותר</button>
    </form>

    <p class="trust">הפרטים שלכם לא יועברו לאף גורם חיצוני</p>
  </div>

  <script>
    var SB_URL  = 'https://hbpapywofrvbcalrwwhq.supabase.co';
    var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhicGFweXdvZnJ2YmNhbHJ3d2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODUwOTUsImV4cCI6MjA5NTY2MTA5NX0.aIvUbNrDTNKeuU4vdIUmBYIitl9t1IbTJo4Ajsz7p2I';

    async function submitLead() {
      var btn    = document.getElementById('submitBtn');
      var errMsg = document.getElementById('errMsg');
      var nameEl = document.getElementById('name');
      var phoneEl= document.getElementById('phone');
      var name   = nameEl.value.trim();
      var phone  = phoneEl.value.trim();

      nameEl.style.borderColor  = '';
      phoneEl.style.borderColor = '';
      errMsg.style.display      = 'none';
      document.getElementById('nameErr').style.display  = 'none';
      document.getElementById('phoneErr').style.display = 'none';

      var hasError = false;
      if (!name || name.length < 2) {
        nameEl.style.borderColor = '#f87171';
        document.getElementById('nameErr').style.display = 'block';
        nameEl.focus();
        hasError = true;
      }
      if (!phone || phone.replace(/\D/g,'').length < 9) {
        phoneEl.style.borderColor = '#f87171';
        document.getElementById('phoneErr').style.display = 'block';
        if (!hasError) phoneEl.focus();
        hasError = true;
      }
      if (hasError) return;

      btn.disabled    = true;
      btn.textContent = 'שולח...';

      try {
        var res = await fetch(SB_URL + '/rest/v1/leads', {
          method:  'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey':        SB_ANON,
            'Authorization': 'Bearer ' + SB_ANON,
            'Prefer':        'return=minimal'
          },
          body: JSON.stringify({ full_name: name, phone: phone })
        });
        if (res.ok) {
          window.location.href = 'https://shaharfinance.com/todah/';
        } else {
          throw new Error();
        }
      } catch (_) {
        errMsg.style.display = 'block';
        btn.disabled         = false;
        btn.textContent      = 'אני רוצה לדעת יותר';
      }
    }
  </script>
</body>
</html>
