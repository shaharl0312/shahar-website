<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --dark: #2D2D2D;
      --cream: #F7F5F0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
      text-align: center;
    }

    .wrap { max-width: 720px; width: 100%; }

    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(201,168,76,.12); border: 1px solid rgba(201,168,76,.3);
      color: #9c7d2e; font-size: 13px; font-weight: 700;
      padding: 7px 18px; border-radius: 40px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(26px, 5.5vw, 38px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    /* responsive 16:9 video container */
    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
      margin-bottom: 36px;
    }
    .video-frame iframe {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    .cta-btn {
      display: inline-block;
      background: var(--gold);
      color: var(--dark);
      font-size: 18px;
      font-weight: 700;
      padding: 18px 40px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(201,168,76,.35);
      transition: transform .2s ease, box-shadow .2s ease;
      margin-bottom: 16px;
    }
    .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(201,168,76,.45); }

    .cta-sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 48px;
    }

    .photo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 3px solid var(--gold);
      margin-bottom: 14px;
    }

    .shahar-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .shahar-role {
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">ההדרכה שלך מוכנה</div>
    <h1>איך לבנות תיק השקעות פסיבי</h1>
    <p class="subtitle">15 דקות. תפסו כוס קפה, ותעקבו אחריי שלב אחר שלב.</p>

    <!--
      Bunny Stream embed - placeholder IDs.
      Replace BUNNY_LIBRARY_ID and BUNNY_VIDEO_ID with the real values once
      the video is uploaded to Bunny Stream (Shahar will provide).
    -->
    <div class="video-frame">
      <iframe
        src="https://iframe.mediadelivery.net/embed/BUNNY_LIBRARY_ID/BUNNY_VIDEO_ID?autoplay=false"
        loading="lazy"
        allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;"
        allowfullscreen="true">
      </iframe>
    </div>

    <!--
      CTA placeholder - update href once the course sales page is live.
      For now points to WhatsApp so leads can reach Shahar directly.
    -->
    <a class="cta-btn" href="https://wa.me/972500000000?text=ראיתי%20את%20ההדרכה%20ורוצה%20לדעת%20עוד" target="_blank" rel="noopener">רוצה לדעת איך זה עובד אצלי - לחצו כאן</a>
    <p class="cta-sub">אענה לכל הודעה אישית</p>

    <img class="photo" src="/shahar_headshot.png" alt="שחר לוי" />
    <div class="shahar-name">שחר לוי</div>
    <div class="shahar-role">ליווי פיננסי לאנשי קבע</div>
  </div>
</body>
</html>
