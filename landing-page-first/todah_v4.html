<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תודה - שחר לוי</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --dark: #2D2D2D;
      --cream: #F7F5F0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 60px;
      text-align: center;
    }

    lottie-player {
      margin: 0 auto 20px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 17px;
      color: #666;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 3px solid var(--gold);
      margin-bottom: 16px;
    }

    .shahar-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .shahar-role {
      font-size: 13px;
      color: #888;
      margin-bottom: 40px;
    }

    .next-steps {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      max-width: 380px;
      width: 100%;
      text-align: right;
      margin-bottom: 32px;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .next-steps h3 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .step:last-child { margin-bottom: 0; }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
      margin-top: 6px;
    }

    .step p {
      font-size: 15px;
      color: #444;
      line-height: 1.5;
    }

    .back {
      font-size: 13px;
      color: #aaa;
      text-decoration: none;
      border-bottom: 1px solid #ddd;
      padding-bottom: 2px;
      transition: color .2s;
    }
    .back:hover { color: var(--dark); }
  </style>
</head>
<body>

  <lottie-player
    src="https://assets5.lottiefiles.com/packages/lf20_jbrw3hcz.json"
    background="transparent"
    speed="1"
    style="width:140px;height:140px;"
    autoplay>
  </lottie-player>

  <h1>קיבלנו אותך!</h1>
  <p class="subtitle">שחר יחזור אליך בהקדם.</p>

  <img src="/shahar_headshot.png" alt="שחר לוי" class="photo" />
  <p class="shahar-name">שחר לוי</p>
  <p class="shahar-role">מלווה פיננסי לקצינים בקבע</p>

  <div class="next-steps">
    <h3>מה קורה עכשיו?</h3>
    <div class="step">
      <div class="step-dot"></div>
      <p>שחר יראה את הפרטים שלך וייצור איתך קשר בהקדם.</p>
    </div>
    <div class="step">
      <div class="step-dot"></div>
      <p>נקבע פגישת היכרות בזום.</p>
    </div>
    <div class="step">
      <div class="step-dot"></div>
      <p>ביחד נבנה תכנית השקעה פשוטה ומותאמת לך.</p>
    </div>
  </div>

  <a href="/" class="back">חזרה לדף הראשי</a>

</body>
</html>
